name: Basscribe alpha6 emulator diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/basscribe-alpha6-diagnostic.yml'
  workflow_dispatch:

jobs:
  emulator_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact alpha6 source commit
        uses: actions/checkout@v4
        with:
          ref: 62c1f3122bb4c6903ce3def9a90550c3df7c2a67

      - name: Reconstruct exact alpha6 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            basscribe-ci/alpha4-source/part00 \
            basscribe-ci/alpha4-source/part01 \
            basscribe-ci/alpha4-source/part02 \
            basscribe-ci/alpha4-source/part03 \
            basscribe-ci/alpha4-source/part04 \
            basscribe-ci/alpha4-source-fix/part05a \
            basscribe-ci/alpha4-source-fix/part05b \
            basscribe-ci/alpha4-source-fix/part05c \
            basscribe-ci/alpha4-source-fix/part05d \
            basscribe-ci/alpha4-source/part06 \
            basscribe-ci/alpha4-source/part07 \
            basscribe-ci/alpha4-source/part08 \
            basscribe-ci/alpha4-source/part09 \
            basscribe-ci/alpha4-source/part10 | base64 -d > /tmp/alpha4.zip
          echo '43e8f9ee05b70fdc379534b976ed977261492ea18085ec6ed059e3ba5c877f5e  /tmp/alpha4.zip' | sha256sum -c -
          rm -rf /tmp/basscribe-alpha6 /tmp/basscribe-alpha5
          mkdir -p /tmp/basscribe-alpha6
          unzip -q /tmp/alpha4.zip -d /tmp/basscribe-alpha6
          ln -s /tmp/basscribe-alpha6 /tmp/basscribe-alpha5
          python3 basscribe-ci/alpha5_patch.py
          cd /tmp/basscribe-alpha6/basscribe_alpha4
          sed 's/arm64-v88a/arm64-v8a/' "$GITHUB_WORKSPACE/basscribe-ci/alpha6-runtime.patch" > /tmp/alpha6-runtime.patch
          echo '57964f38b4305302861df8f6f5cc1b5c654a496fcb9028391b004bfc34ea1230  /tmp/alpha6-runtime.patch' | sha256sum -c -
          patch -p0 < /tmp/alpha6-runtime.patch
          patch -p0 < "$GITHUB_WORKSPACE/basscribe-ci/alpha6-support/fingering-fix.patch"
          cp "$GITHUB_WORKSPACE/basscribe-ci/alpha6-support/pitch_periodicity.h" native/pitch_periodicity.h
          mkdir -p tests
          cp "$GITHUB_WORKSPACE/basscribe-ci/alpha6-support/generate_qa_fixture.py" tests/generate_qa_fixture.py
          echo '0e2fc19347924eb9288b8982f15693e08e65c284c97be1d1dea0e1402de35113  game/main.lua' | sha256sum -c -
          echo '98d59952f64a3eb33318b3234039f68979c87b941c6e86c849d86a7e90c0a801  native/basscribe_ai.cpp' | sha256sum -c -
          echo '26dc3c764c1fd4bb4aa245dcae08d5b738ca74814d184c0758a683b95cd8dc54  native/pitch_periodicity.h' | sha256sum -c -
          echo 'f867daed945de1a27ca04f3e99036ec04b149238e47a615760d72417945ed0a5  build_android.sh' | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build x86_64 QA APK and fixture
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/basscribe-alpha6/basscribe_alpha4
          python3 tests/generate_qa_fixture.py
          chmod +x build_android.sh
          BASSCRIBE_ABI=x86_64 ./build_android.sh

      - name: Prepare host-side diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          EVID="$GITHUB_WORKSPACE/alpha6-diagnostic"
          ROOT=/tmp/basscribe-alpha6/basscribe_alpha4
          mkdir -p "$EVID"
          echo "$(date -u +%FT%TZ) host-before-emulator" > "$EVID/status.txt"
          {
            echo "checked_out_commit=$(git rev-parse HEAD)"
            echo "expected_source_commit=62c1f3122bb4c6903ce3def9a90550c3df7c2a67"
            uname -a
            java -version 2>&1
            df -h
          } > "$EVID/host-before.txt"
          test "$(git rev-parse HEAD)" = '62c1f3122bb4c6903ce3def9a90550c3df7c2a67'
          ls -lh \
            "$ROOT/dist/Basscribe-v0.5.0-ai-alpha6-x86_64.apk" \
            "$ROOT/tests/qa_pitch_fixture.wav" > "$EVID/built-files.txt"

      - name: Android emulator diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6000M
          disable-animations: true
          script: |
            set -Eeuo pipefail
            ROOT=/tmp/basscribe-alpha6/basscribe_alpha4
            APK="$ROOT/dist/Basscribe-v0.5.0-ai-alpha6-x86_64.apk"
            FIX="$ROOT/tests/qa_pitch_fixture.wav"
            EVID="$GITHUB_WORKSPACE/alpha6-diagnostic"
            mkdir -p "$EVID"
            mark() { echo "$(date -u +%FT%TZ) $*" | tee -a "$EVID/status.txt"; }
            capture() {
              set +e
              adb devices -l > "$EVID/adb-devices-final.txt" 2>&1
              adb shell getprop sys.boot_completed > "$EVID/boot-completed-final.txt" 2>&1
              adb logcat -d > "$EVID/logcat.txt" 2>&1
              adb exec-out screencap -p > "$EVID/screen.png" 2>/dev/null
              adb exec-out uiautomator dump /dev/tty | sed -n '/<?xml/,$p' > "$EVID/ui-current.xml" 2>/dev/null
              adb shell dumpsys window windows > "$EVID/window.txt" 2>&1
              adb shell dumpsys activity activities > "$EVID/activity.txt" 2>&1
              adb shell ls -lah /sdcard/Download > "$EVID/downloads.txt" 2>&1
              set -e
            }
            trap 'rc=$?; mark "EXIT rc=$rc"; capture; exit $rc' EXIT

            mark 'script-entered'
            command -v adb | tee "$EVID/adb-path.txt"
            adb devices -l | tee "$EVID/adb-devices.txt"
            mark 'wait-for-device'
            adb wait-for-device
            mark "boot-completed=$(adb shell getprop sys.boot_completed | tr -d '\r')"
            mark 'install-apk'
            adb install -r "$APK" | tee "$EVID/install.txt"
            mark 'push-fixture'
            adb push "$FIX" /sdcard/Download/qa_pitch_fixture.wav | tee "$EVID/push.txt"
            adb shell ls -l /sdcard/Download/qa_pitch_fixture.wav | tee "$EVID/fixture-ls.txt"
            adb logcat -c

            PKG=com.brad.basscrib7
            ACT=$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)
            mark "activity=$ACT"
            test -n "$ACT"
            adb shell am force-stop "$PKG"
            adb shell am start -n "$ACT" | tee "$EVID/start.txt"
            sleep 7
            mark 'after-launch-wait'

            adb exec-out uiautomator dump /dev/tty | sed -n '/<?xml/,$p' > "$EVID/ui-picker-1.xml" || true
            cp "$EVID/ui-picker-1.xml" /tmp/ui.xml
            head -c 12000 "$EVID/ui-picker-1.xml" > "$EVID/ui-picker-1-head.txt" || true

            PICK="$GITHUB_WORKSPACE/basscribe-ci/alpha6-support/ui_pick.py"
            if XY=$(python3 "$PICK" /tmp/ui.xml 'qa_pitch_fixture.wav'); then
              mark "fixture-visible-at $XY"
            else
              mark 'fixture-not-visible; looking-for-Downloads'
              if XY=$(python3 "$PICK" /tmp/ui.xml 'Downloads'); then
                mark "downloads-visible-at $XY"
                adb shell input tap $XY
                sleep 3
                adb exec-out uiautomator dump /dev/tty | sed -n '/<?xml/,$p' > "$EVID/ui-picker-2.xml" || true
                cp "$EVID/ui-picker-2.xml" /tmp/ui.xml
              else
                mark 'Downloads-not-visible'
              fi
              XY=$(python3 "$PICK" /tmp/ui.xml 'qa_pitch_fixture.wav')
              mark "fixture-after-navigation-at $XY"
            fi

            adb shell input tap $XY
            mark 'fixture-tapped'
            sleep 3
            adb exec-out uiautomator dump /dev/tty | sed -n '/<?xml/,$p' > "$EVID/ui-after-tap.xml" || true

            FOUND=0
            for i in $(seq 1 180); do
              adb logcat -d > "$EVID/logcat.txt"
              if grep -F 'BASSCRIBE_ERROR' "$EVID/logcat.txt" > "$EVID/result-error.txt"; then
                mark 'app-reported-error'
                cat "$EVID/result-error.txt"
                exit 41
              fi
              if grep -F 'BASSCRIBE_RESULT version=0.5.0-ai-alpha6' "$EVID/logcat.txt" | tail -1 > "$EVID/result.txt" && test -s "$EVID/result.txt"; then
                FOUND=1
                mark "result-found iteration=$i"
                cat "$EVID/result.txt"
                break
              fi
              if (( i % 12 == 0 )); then mark "waiting-for-result iteration=$i"; fi
              sleep 5
            done
            test "$FOUND" = 1

            python3 - "$EVID/result.txt" <<'PY'
            import re, sys
            line=open(sys.argv[1]).read().strip()
            m=re.search(r'first=(.*)$',line); assert m, line
            tokens=[]
            for part in m.group(1).split('|'):
                f=part.split(':')
                if len(f)>=4: tokens.append((float(f[0]),int(f[1]),f[2]))
            assert tokens, line
            mids=[m for _,m,_ in tokens]
            assert 41 in mids[:4], mids[:10]
            first41=mids.index(41)
            assert 48 in mids[first41+1:12], mids[:12]
            assert 45 in mids[:16], mids[:16]
            assert 52 in mids[:20], mids[:20]
            assert any(m==48 and pos=='D10' for _,m,pos in tokens[:16]), tokens[:16]
            print('android neural QA regression: PASS', tokens[:12])
            PY
            mark 'ANDROID-NEURAL-QA-PASS'
            capture
            trap - EXIT

      - name: Collect host-side post-emulator evidence
        if: always()
        shell: bash
        run: |
          set +e
          EVID="$GITHUB_WORKSPACE/alpha6-diagnostic"
          mkdir -p "$EVID"
          echo "$(date -u +%FT%TZ) host-after-emulator" >> "$EVID/status.txt"
          {
            echo '=== adb ==='
            command -v adb || true
            adb devices -l || true
            echo '=== emulator/qemu processes ==='
            ps aux | grep -E '[e]mulator|[q]emu' || true
            echo '=== android avd files ==='
            find "$HOME/.android/avd" -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | head -200 || true
            echo '=== disk ==='
            df -h || true
          } > "$EVID/host-after.txt" 2>&1

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Basscribe-alpha6-emulator-diagnostic
          path: alpha6-diagnostic/
          if-no-files-found: error
          retention-days: 7
